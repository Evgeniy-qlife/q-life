<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q-Life | ИИ + Квантовые Алгоритмы</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0f0f13; color: #eee; margin: 0; padding: 15px; }
        .container { max-width: 700px; margin: auto; }
        h2 { color: #00FFAA; text-align: center; margin-bottom: 5px; }
        .settings { background: #1e1e24; padding: 10px; border-radius: 8px; margin-bottom: 15px; font-size: 12px;}
        select, input { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #333; background: #1e1e24; color: #fff; font-size: 14px; box-sizing: border-box;}
        button { width: 100%; padding: 15px; background: #00FFAA; color: #000; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; }
        button:disabled { background: #444; color: #888; }
        .chat-box { height: 350px; overflow-y: auto; border: 1px solid #2a2a35; padding: 15px; margin-bottom: 15px; border-radius: 8px; background: #16161c; display: none; }
        .message { margin-bottom: 12px; padding: 12px; border-radius: 8px; font-size: 14px; line-height: 1.4; animation: fadeIn 0.4s ease-in-out; }
        .user { background: #1e3a5f; text-align: right; margin-left: 20%; }
        .ai { background: #1e4620; text-align: left; margin-right: 20%; }
        .system { background: #4a1e5f; text-align: center; font-weight: bold; color: #d8b4fe; font-size: 12px; }
        .input-area { display: none; gap: 10px; margin-bottom: 15px; }
        #result-area { display: none; animation: fadeIn 0.8s ease-in-out; }
        .chart-wrapper { background: #16161c; padding: 15px; border-radius: 8px; margin-bottom: 25px; border: 1px solid #2a2a35; }
        .analysis-box { background: #1a1a24; padding: 25px; border-radius: 8px; border-left: 4px solid #00FFAA; }
        .analysis-box h3 { margin-top: 0; color: #00FFAA; }
        .empathy { font-style: italic; color: #bbb; margin-bottom: 20px; line-height: 1.6; }
        .quantum-insight { color: #FFD700; font-weight: bold; margin-bottom: 20px; }
        .analysis-box ul { padding-left: 20px; font-size: 14px; line-height: 1.6; }
        .analysis-box li { margin-bottom: 12px; }
        .highlight { color: #00FFAA; font-weight: bold; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="container">
        <h2>🌌 Q-Life</h2>
        
        <div class="settings">
            <label>OpenAI API Key (хранится только в вашем браузере):</label>
            <input type="password" id="apiKey" placeholder="sk-...">
        </div>

        <select id="algo-select">
            <option value="qaoa">⚖️ QAOA (Баланс ресурсов)</option>
            <option value="grover">🔍 Гровер (Поиск призвания)</option>
            <option value="annealing">⛏️ Отжиг (Выход из тупика)</option>
            <option value="vqe">🧘 VQE (Внутренний покой)</option>
            <option value="qec">🛡️ QEC (Защита от стресса)</option>
        </select>
        
        <button id="start-btn" onclick="startSession()">🚀 Начать ИИ-сессию</button>
        
        <div class="chat-box" id="chat-box"></div>
        <div class="input-area" id="input-area">
            <input type="text" id="user-input" placeholder="Ваш ответ..." onkeypress="handleEnter(event)">
            <button onclick="sendMessage()" style="width: 30%;">➤</button>
        </div>

        <div id="result-area">
            <div class="chart-wrapper"><canvas id="quantumChart"></canvas></div>
            <div class="analysis-box" id="analysis-text"></div>
        </div>
    </div>

    <script>
        const systemPrompts = {
            qaoa: "Ты — ИИ-коуч по оптимизации (QAOA). Задай 3 вопроса о балансе работы и отдыха. В конце выдай СТРОГО JSON: [РЕЗУЛЬТАТ: {\"energy\": 50, \"capital\": 50, \"knowledge\": 50, \"insight\": \"вывод\", \"empathy\": \"слова поддержки\", \"step\": \"маленький шаг\"}]",
            grover: "Ты — ИИ-коуч по призванию (Гровер). Задай 3 вопроса о смысле и страхах. В конце выдай СТРОГО JSON: [РЕЗУЛЬТАТ: {\"energy\": 50, \"capital\": 50, \"knowledge\": 50, \"insight\": \"вывод\", \"empathy\": \"слова поддержки\", \"step\": \"маленький шаг\"}]",
            annealing: "Ты — ИИ-коуч по туннелированию. Задай 3 вопроса о том, где человек застрял. В конце выдай СТРОГО JSON: [РЕЗУЛЬТАТ: {\"energy\": 50, \"capital\": 50, \"knowledge\": 50, \"insight\": \"вывод\", \"empathy\": \"слова поддержки\", \"step\": \"маленький шаг\"}]",
            vqe: "Ты — ИИ-коуч по покою (VQE). Задай 3 вопроса о тревоге. В конце выдай СТРОГО JSON: [РЕЗУЛЬТАТ: {\"energy\": 50, \"capital\": 50, \"knowledge\": 50, \"insight\": \"вывод\", \"empathy\": \"слова поддержки\", \"step\": \"маленький шаг\"}]",
            qec: "Ты — ИИ-коуч по квантовой коррекции ошибок (QEC). Задай 3 вопроса о том, что или кто высасывает из человека энергию (токсичное окружение, шум, хаос). В конце выдай СТРОГО JSON: [РЕЗУЛЬТАТ: {\"energy\": 30, \"capital\": 40, \"knowledge\": 50, \"insight\": \"вывод\", \"empathy\": \"слова поддержки\", \"step\": \"маленький шаг\"}]"
        };

        let messages = [];
        let currentAlgo = 'qaoa';
        let myChart = null;

        function handleEnter(e) { if (e.key === 'Enter') sendMessage(); }

        async function startSession() {
            const apiKey = document.getElementById('apiKey').value.trim();
            if (!apiKey.startsWith('sk-')) return alert("Пожалуйста, вставьте ваш OpenAI API Key (начинается на sk-)");
            
            currentAlgo = document.getElementById('algo-select').value;
            const chatBox = document.getElementById('chat-box');
            const inputArea = document.getElementById('input-area');
            const btn = document.getElementById('start-btn');
            const resultArea = document.getElementById('result-area');

            btn.disabled = true; btn.innerText = "ИИ анализирует...";
            chatBox.style.display = 'block'; chatBox.innerHTML = '';
            inputArea.style.display = 'flex'; resultArea.style.display = 'none';
            if (myChart) myChart.destroy();

            messages = [{ role: 'system', content: systemPrompts[currentAlgo] }];
            
            // Первый вопрос от ИИ
            await callAI("Привет. Я готов помочь. Начнем с простого: что вас сейчас беспокоит больше всего?");
        }

        async function callAI(userText) {
            const apiKey = document.getElementById('apiKey').value.trim();
            const chatBox = document.getElementById('chat-box');
            
            if (userText) {
                addMessage('user', userText);
                messages.push({ role: 'user', content: userText });
            }

            addMessage('system', 'ИИ печатает...');

            try {
                const res = await fetch('https://api.openai.com/v1/chat/completions', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
                    body: JSON.stringify({ model: 'gpt-4o-mini', messages: messages, temperature: 0.7 })
                });
                const data = await res.json();
                
                // Удаляем плашку "ИИ печатает..."
                chatBox.removeChild(chatBox.lastChild);

                if (data.error) {
                    addMessage('system', 'Ошибка API: ' + data.error.message);
                    return;
                }

                let reply = data.choices[0].message.content;
                
                if (reply.includes('[РЕЗУЛЬТАТ:')) {
                    let jsonStr = reply.split('[РЕЗУЛЬТАТ:')[1].split(']')[0].trim();
                    jsonStr = jsonStr.replace(/```json/g, '').replace(/```/g, '');
                    const finalData = JSON.parse(jsonStr);
                    const cleanReply = reply.split('[РЕЗУЛЬТАТ:')[0].trim();
                    
                    addMessage('ai', cleanReply);
                    document.getElementById('input-area').style.display = 'none';
                    showResult(finalData);
                } else {
                    addMessage('ai', reply);
                    messages.push({ role: 'assistant', content: reply });
                }
            } catch (e) {
                addMessage('system', 'Ошибка сети. Проверьте интернет.');
            }
        }

        async function sendMessage() {
            const input = document.getElementById('user-input');
            const text = input.value.trim();
            if (!text) return;
            input.value = '';
            await callAI(text);
        }

        function addMessage(role, text) {
            const box = document.getElementById('chat-box');
            const div = document.createElement('div');
            div.className = `message ${role}`;
            div.innerText = text;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }

        function showResult(data) {
            document.getElementById('result-area').style.display = 'block';
            document.getElementById('analysis-text').innerHTML = `
                <h3>Результат анализа (${currentAlgo.toUpperCase()})</h3>
                <div class="empathy">«${data.empathy}»</div>
                <div class="quantum-insight">💡 Квантовый инсайт: ${data.insight}</div>
                <ul>
                    <li><b class="highlight">Ваш следующий шаг:</b> ${data.step}</li>
                </ul>
            `;

            const ctx = document.getElementById('quantumChart').getContext('2d');
            let chartData = [data.energy, data.capital, data.knowledge];
            let labels = ["Энергия", "Капитал", "Знания"];
            let colors = ['#ff4d4d', '#00FFAA', '#00BFFF'];

            if (currentAlgo === 'qec') {
                labels = ["Стресс", "Шум", "Устойчивость"];
                chartData = [100 - data.energy, 100 - data.capital, data.knowledge];
            }

            myChart = new Chart(ctx, {
                type: 'bar',
                data: { labels: labels, datasets: [{ label: 'Уровень', data: chartData, backgroundColor: colors }] },
                options: { plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, max: 100, ticks: { color: '#fff' } }, x: { ticks: { color: '#fff' } } } }
            });
        }
    </script>
</body>
</html>
